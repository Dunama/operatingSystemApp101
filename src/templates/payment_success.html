<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex flex-col justify-center items-center">
    <div class="w-full max-w-md mx-auto bg-white rounded-xl shadow-lg p-6 sm:p-8 mt-8">
        <div class="text-center">
            <div class="bg-green-100 rounded-full p-4 inline-block mb-4">
                <i class="fas fa-check-circle text-green-500 text-4xl"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-center text-green-700 mb-2">Payment Successful!</h1>
            <p class="text-gray-600 mb-6">Thank you for upgrading to Quiz App Pro.</p>
            
            <div class="bg-gray-50 rounded-lg p-4 text-left mb-6">
                <p class="text-sm text-gray-600 mb-1"><span class="font-semibold">Transaction ID:</span> {{ transaction_id }}</p>
                <p class="text-sm text-gray-600 mb-1"><span class="font-semibold">Amount:</span> {{ amount }}</p>
                <p class="text-sm text-gray-600"><span class="font-semibold">Product:</span> {{ product_name }}</p>
            </div>
            
            <p class="text-sm text-gray-600 mb-6">Your Pro access has been activated. You can now access all features of the Quiz App.</p>
            
            <a href="{{ url_for('auth.login') }}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md transition-colors">
                Go to Quiz App
            </a>
        </div>
    </div>
    <p class="mt-6 text-center text-xs text-gray-400">© 2024 Quiz App. All rights reserved.</p>
</body>
</html>
