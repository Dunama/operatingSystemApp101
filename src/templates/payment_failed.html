<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex flex-col justify-center items-center">
    <div class="w-full max-w-md mx-auto bg-white rounded-xl shadow-lg p-6 sm:p-8 mt-8">
        <div class="text-center">
            <div class="bg-red-100 rounded-full p-4 inline-block mb-4">
                <i class="fas fa-times-circle text-red-500 text-4xl"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-center text-red-700 mb-2">Payment Failed</h1>
            <p class="text-gray-600 mb-6">We couldn't process your payment.</p>
            
            <div class="bg-gray-50 rounded-lg p-4 text-left mb-6">
                <p class="text-sm text-gray-600">{{ message }}</p>
            </div>
            
            <p class="text-sm text-gray-600 mb-6">Please try again or contact support if the problem persists.</p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="/api/auth/login" class="inline-block bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-md transition-colors">
                    Return to App
                </a>
                <button onclick="window.history.back()" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md transition-colors">
                    Try Again
                </button>
            </div>
        </div>
    </div>
    <p class="mt-6 text-center text-xs text-gray-400">© 2024 Quiz App. All rights reserved.</p>
</body>
</html>
